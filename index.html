<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1A3D8F">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hockey Unión">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Planificación Hockey Unión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna de trabajo. Arriba el macrociclo como cinta de fases,
   después la grilla categoría × semana (lo que se opera) y debajo el detalle de la semana elegida. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunk:#E6ECEE; --fg:#10201F; --muted:#55676A; --line:#CDD7DA;
  --accent:#1D4FA3; --accent2:#D9412A; --accent-fg:#FFFFFF; --warn:#B4381F;
  --t1:#5E8C8A; --t2:#2F6FB5; --t3:#8A8FA0; --t4:#2E9B62; --t5:#D08A1A; --t6:#D2552F;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1517; --surface:#162225; --sunk:#0A1113; --fg:#E6EEEE; --muted:#93A6A8; --line:#2B3B3F;
    --accent:#86ABF2; --accent2:#F0694D; --accent-fg:#0A1B3A; --warn:#F08A6E;
    --t1:#7FB3B0; --t2:#5B9BE0; --t3:#A3A8BA; --t4:#4CC084; --t5:#E6A63C; --t6:#EB7A55;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1517; --surface:#162225; --sunk:#0A1113; --fg:#E6EEEE; --muted:#93A6A8; --line:#2B3B3F;
  --accent:#86ABF2; --accent2:#F0694D; --accent-fg:#0A1B3A; --warn:#F08A6E;
  --t1:#7FB3B0; --t2:#5B9BE0; --t3:#A3A8BA; --t4:#4CC084; --t5:#E6A63C; --t6:#EB7A55;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:700;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:1.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:1.25rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:.95rem;color:var(--accent2)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
header.top{display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.crest{flex:none;width:auto;height:84px;background:#FFFFFF;border-radius:8px;padding:4px;border:1px solid var(--line)}
.brandtxt{display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:480px){ .crest{height:60px} }
body[data-view="inicio"] .crest{height:128px}
@media (max-width:480px){ body[data-view="inicio"] .crest{height:92px} }
body[data-view="inicio"] .brandtxt h1{font-size:clamp(2rem,7vw,3.6rem)}
.home{display:flex;flex-direction:column;gap:18px;margin-bottom:8px}
.home .today::first-letter{text-transform:uppercase}.home .today{font-family:var(--display);font-size:1.35rem;font-weight:600;letter-spacing:.02em}
.todaycards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.tcard b{font-family:var(--display);font-size:1.2rem;text-transform:uppercase;letter-spacing:.02em}
.tcard span{color:var(--muted);font-size:.95rem}
.sched{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
.sched th,.sched td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.sched th{background:var(--sunk);font-family:var(--display);text-transform:uppercase;letter-spacing:.04em}
.sched td:first-child,.sched th:first-child{text-align:left;font-weight:600}
.sched td.now,.sched th.now{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.wk{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--muted);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.wk.partido{border-left-color:var(--accent2)}.wk.libre{border-left-color:var(--t4)}
.wk .lab{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wk b{font-family:var(--display);font-size:1.7rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.calhead .mes{font-family:var(--display);font-size:1.3rem;font-weight:600;text-transform:capitalize;min-width:170px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-family:var(--display);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:2px 0}
.cal button{min-height:68px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:5px 6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer;font:inherit;text-align:left;min-width:0;position:relative}
.cal button .n{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1}
.cal button.fin{background:var(--sunk)}
.cal button.hoy{outline:2px solid var(--accent);outline-offset:-2px}
.cal button.hoy .n{color:var(--accent)}
.cal button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.cal .ev{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:4px;padding:1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.partido{background:var(--accent2);color:#fff}.cal .ev.libre{background:var(--t4);color:#06281a}
.cal .tr{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cal .chk{position:absolute;top:4px;right:5px}
.chk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#1E9E5A;color:#fff;font-weight:700;font-size:.9rem;line-height:1}
.cal button.par{border-color:#1E9E5A}
.cal button[data-tip]:hover::after,.cal button[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:15;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:.82rem;font-weight:600;padding:6px 10px;border-radius:6px;width:max-content;max-width:240px;white-space:normal;text-align:center;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
@media (max-width:520px){.cal .chk{width:17px;height:17px;font-size:.7rem;top:3px;right:3px}}
.callegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);align-items:center}
.callegend span{display:inline-flex;align-items:center;gap:6px}
.dayed{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dayed .opts{display:flex;gap:8px;flex-wrap:wrap}
.dayed .opts button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (max-width:520px){.cal{gap:2px}.cal button{min-height:54px;padding:4px 3px}.cal .ev{font-size:.56rem;padding:1px 2px;letter-spacing:0}}
.top2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:stretch}
.hoybox{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.hoybox .lab{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hoybox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hoybox li b{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.02em;margin-right:8px}
.hoybox li span{color:var(--muted)}
.hoybox a{font-size:.88rem;font-weight:600;color:var(--accent);margin-top:auto}
.mwrap{position:relative;display:flex}
#nav-menu{line-height:inherit;margin:0}
.nav{align-items:stretch}
#nav-menu{font-family:var(--display);font-weight:600;font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer}
#nav-menu:hover,#nav-menu[aria-expanded="true"]{color:var(--fg)}
#nav-menu[data-on]{color:var(--fg);border-bottom-color:var(--accent2)}
#nav-menu:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mpop{position:absolute;top:100%;left:0;z-index:20;min-width:230px;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column}
.mpop[hidden]{display:none}
.nav .mpop a{font-family:var(--body);font-size:1rem;font-weight:600;text-transform:none;letter-spacing:0;color:var(--fg);padding:11px 14px;border:0;border-radius:6px}
.nav .mpop a:hover{background:var(--sunk)}
.nav .mpop a[aria-current="page"]{background:var(--sunk);color:var(--accent);border:0}
.nav .mpop a[hidden]{display:none}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.menu a{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:18px 20px;text-decoration:none;color:var(--fg)}
.menu a:hover{border-color:var(--accent)}
.menu a b{font-family:var(--display);font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em}
.menu a span{color:var(--muted);font-size:.92rem}
.menu a[hidden]{display:none}
.hrow{display:grid;grid-template-columns:minmax(110px,1.2fr) repeat(6,minmax(70px,1fr));gap:6px;align-items:center}
.hrow input{min-width:0;width:100%}
@media (max-width:700px){.hrow{grid-template-columns:repeat(3,1fr)}.hrow .hn{grid-column:1/-1;font-weight:600}}
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.pill{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.pill.err{color:var(--warn);border-color:var(--warn)}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
main{display:flex;flex-direction:column;gap:40px;min-width:0}

/* cinta de fases */
.strip{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px}
.strip span{display:block;min-width:4px}
.phases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px 24px}
.phase{display:flex;flex-direction:column;gap:4px;min-width:0}
.phase .head{display:flex;gap:8px;align-items:baseline}
.chip{flex:none;width:12px;height:12px;border-radius:2px;background:var(--tone);display:inline-block}
.tone1{--tone:var(--t1)}.tone2{--tone:var(--t2)}.tone3{--tone:var(--t3)}.tone4{--tone:var(--t4)}.tone5{--tone:var(--t5)}.tone6{--tone:var(--t6)}
.dates{font-variant-numeric:tabular-nums;font-size:.86rem;color:var(--muted)}

/* grilla */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.grid th,.grid td{padding:0;border-bottom:1px solid var(--line)}
.grid tbody tr:last-child th,.grid tbody tr:last-child td{border-bottom:0}
.grid th.corner,.grid th.cat{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:8px 12px;border-right:1px solid var(--line);
  min-width:118px;max-width:150px;font-weight:600;font-size:.86rem;line-height:1.25}
.grid th.corner{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:.85rem;vertical-align:bottom}
.grid th.ph{font-family:var(--display);font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:8px 8px 6px;
  border-top:4px solid var(--tone);line-height:1.1;vertical-align:top}
.grid th.wk{min-width:54px;padding:6px 4px;font-weight:500;text-align:center;line-height:1.2}
.grid th.wk .wn{display:block;font-family:var(--display);font-weight:600;font-size:1rem}
.grid th.wk .wd{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap}
.grid th.wk .tag{display:block;font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);height:1em;line-height:1}
.grid .yr{border-left:2px solid var(--fg)}
.cell{display:block;width:100%;min-width:54px;height:44px;border:0;margin:0;cursor:pointer;font:600 1.05rem var(--display);color:var(--fg);
  background:var(--surface);outline-offset:-3px}
.cell.l1{background:color-mix(in oklab,var(--tone) 12%,var(--surface))}
.cell.l2{background:color-mix(in oklab,var(--tone) 24%,var(--surface))}
.cell.l3{background:color-mix(in oklab,var(--tone) 36%,var(--surface))}
.cell.l4{background:color-mix(in oklab,var(--tone) 48%,var(--surface))}
.cell.l5{background:color-mix(in oklab,var(--tone) 60%,var(--surface))}
.cell.l0{color:var(--muted);font-weight:500}
.cell:hover{outline:2px solid var(--muted)}
.cell[aria-pressed="true"]{outline:3px solid var(--fg)}
.cell:focus-visible{outline:3px solid var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.legend .sw{display:inline-flex;gap:2px;vertical-align:middle}
.legend .sw i{width:16px;height:12px;display:block}

/* editor de semana */
.editor{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:18px}
.edhead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.edhead .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f>span,.lab{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical;line-height:1.4}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input:disabled,textarea:disabled{opacity:.75}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
button.b{font:600 .88rem var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button.b:hover{border-color:var(--muted)}
button.b.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.b.ico{padding:7px 10px;min-width:36px}
button.b.danger{color:var(--warn)}
button.b:disabled{opacity:.4;cursor:default}
.loads{display:flex;gap:4px}
.loads button{width:40px;height:36px;font:600 1.1rem var(--display);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
.loads button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.login{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.login .err{color:var(--warn);font-size:.88rem;min-height:1.2em}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:.88rem;cursor:pointer;text-decoration:underline;text-align:left}
/* planilla de sesión */
.sx{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.shead{background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:600;font-size:1.1rem;text-transform:uppercase;letter-spacing:.05em;padding:8px 12px}
.smeta{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.9rem;font-variant-numeric:tabular-nums}
.smeta span{color:var(--muted)} .smeta b{color:var(--fg)}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr);border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.slab{background:var(--sunk);padding:10px 12px;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:6px;min-width:0}
.slab input{font:400 .85rem var(--body);letter-spacing:0;padding:6px 8px}
.sbody{padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sbreak{background:var(--sunk);color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;padding:6px 12px;border-bottom:1px solid var(--line);text-align:center}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px}
.exlist.one{grid-template-columns:minmax(0,1fr)}
.ex{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:6px}
.ex input,.sbody textarea,.sbody input{padding:6px 8px}
.circs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.circ{display:flex;flex-direction:column;gap:8px;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);font-weight:600}
.mini input[type=text]{width:90px}
.mini input[type=date]{width:150px}
.grps{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
@media (max-width:640px){ .srow{grid-template-columns:minmax(0,1fr)} }
/* wellness */
.wq{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.wq .qt{font-family:var(--display);font-weight:600;font-size:1.2rem}
.scale{display:flex;gap:6px}
.scale button{flex:1;min-width:0;height:48px;font:600 1.25rem var(--display);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.athbox{max-width:560px;width:100%}
.sum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-variant-numeric:tabular-nums}
.sum b{font-family:var(--display);font-size:1.15rem}
.low{color:var(--warn);font-weight:700}
.rtype{display:flex;gap:8px;flex-wrap:wrap}
.rtype button{flex:1;min-width:130px;padding:12px;font:600 1.05rem var(--display);text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;cursor:pointer}
.rtype button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rscale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rscale button{height:48px;font:600 1.25rem var(--display);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;cursor:pointer}
.rscale button[aria-pressed="true"]{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.rlab{font-family:var(--display);font-size:1.1rem;font-weight:600;min-height:1.6em}
.rdone{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.wctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.wctl label.f{width:auto}
.wmode{display:flex;gap:6px}
.wmode button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sheet td.r,.sheet th.r{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.hoyc,.sheet th.hoyc{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.faltan{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:8px;padding:10px 14px}
.faltan.ok{border-left-color:#1E9E5A}
#reg:not([hidden]){display:flex;flex-direction:column;gap:16px}
.prow{display:grid;grid-template-columns:minmax(130px,170px) minmax(0,1fr) auto;gap:8px;align-items:center}

.cal button[data-tip]:hover::after,.cal button[data-tip]:focus-visible::after{white-space:pre-line;text-align:left}
.zonas{display:flex;flex-wrap:wrap;gap:6px}
.zonas button{padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;cursor:pointer;font:500 .92rem var(--body)}
.zonas button[aria-pressed="true"]{background:var(--warn);color:#fff;border-color:var(--warn)}
.alist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.arow .st{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.aopt{display:flex;gap:4px}
.aopt button{padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer;font:600 .88rem var(--body)}
.aopt button[aria-pressed="true"][data-as="p"]{background:#1E9E5A;color:#fff;border-color:#1E9E5A}
.aopt button[aria-pressed="true"][data-as="a"]{background:var(--warn);color:#fff;border-color:var(--warn)}
.aopt button[aria-pressed="true"][data-as="j"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (max-width:560px){.arow{grid-template-columns:1fr}.arow .st{order:3}}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.chartc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.chartc .ct{font-weight:600;font-size:.9rem}
.chartc .ct small{color:var(--muted);font-weight:500}
.chartc svg{width:100%;height:auto;display:block;overflow:visible}
.chartc svg text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chartc svg text.v{fill:var(--fg);font-weight:600}
.chartc .hit:hover + .dot{r:6}
.mibox{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;max-width:560px;width:100%}
.mibox .lab{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mibox b.big{font-family:var(--display);font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.kv span:nth-child(odd){color:var(--muted)}
.sheet td.note{white-space:normal;min-width:180px;max-width:320px}
/* ajustes */
.settings{display:flex;flex-direction:column;gap:28px}
.basics{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.list{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:auto minmax(0,2fr) 84px minmax(0,3fr) auto;gap:8px;align-items:center}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;max-width:520px}
.tonebtn{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--tone);cursor:pointer}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:center;max-width:520px}
/* planteles y tests */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:600 .86rem var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.tab .n{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-pressed="true"] .n{color:var(--bg)}
.nav{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.nav a{font-family:var(--display);font-weight:600;font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-decoration:none;padding:8px 14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent2)}
.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.view{display:flex;flex-direction:column;gap:40px;min-width:0}
.roster{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.roster.has-sel{grid-template-columns:minmax(0,300px) minmax(0,1fr)}
.squads{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 24px;min-width:0}
.roster.has-sel .squads{grid-template-columns:minmax(0,1fr)}
.squad{display:flex;flex-direction:column;gap:8px;min-width:0}
.sqhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;background:none;border:0;border-bottom:2px solid var(--accent);padding:6px 2px;cursor:pointer;color:var(--fg);text-align:left;font:inherit}
.sqhead:hover .sqname{color:var(--accent)}
.sqname{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.1}
.sqhead .n{white-space:nowrap}
.sqhead .n{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--muted);font-variant-numeric:tabular-nums}
select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.plist{display:flex;flex-direction:column;gap:4px;min-width:0}
.pbtn{text-align:left;font:500 .95rem var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;overflow-wrap:anywhere}
.pbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.sheetwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.sheet{border-collapse:collapse;font-variant-numeric:tabular-nums;width:100%}
.sheet th,.sheet td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.sheet thead th{font-size:.82rem;font-weight:600;vertical-align:bottom}

.sheet tbody input[type=text]{width:84px}
.sheet tbody input[type=date]{width:150px}
.sheet tfoot th,.sheet tfoot td{border-bottom:0;font-weight:600;font-size:.88rem;color:var(--muted)}

  .prow{grid-template-columns:auto minmax(0,1fr) 72px;padding-bottom:10px;border-bottom:1px solid var(--line)}

  .prow .acts{grid-column:1 / -1}
}

/* ===== Identidad Unión: banda azul del club con filete rojo, tipografía Barlow ===== */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E9EDF4; --fg:#16223A; --muted:#5A6579; --line:#D7DDE7;
  --accent:#1A3D8F; --accent2:#E2401F; --accent-fg:#FFFFFF; --warn:#C2361A;
  --band:#1A3D8F; --band-fg:#FFFFFF; --band-soft:rgba(255,255,255,.72);
  --body:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px; --r-lg:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --surface:#162136; --sunk:#0B1220; --fg:#E7ECF5; --muted:#9BA7BD; --line:#2A3752;
    --accent:#8EADF5; --accent2:#FF6B4A; --accent-fg:#0B1838; --warn:#FF8A6E;
    --band:#12295F; --band-fg:#FFFFFF; --band-soft:rgba(255,255,255,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#162136; --sunk:#0B1220; --fg:#E7ECF5; --muted:#9BA7BD; --line:#2A3752;
  --accent:#8EADF5; --accent2:#FF6B4A; --accent-fg:#0B1838; --warn:#FF8A6E;
  --band:#12295F; --band-fg:#FFFFFF; --band-soft:rgba(255,255,255,.7);
}
body{font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{padding-top:0;gap:32px}

/* Banda del club */
header.top{margin-inline:calc(50% - 50vw);padding:18px max(16px,calc(50vw - 574px)) 26px;
  background:var(--band);color:var(--band-fg);border-bottom:6px solid var(--accent2);gap:14px}
header.top .toprow{gap:10px}
.club-sub{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.04em;color:var(--band-soft)}
header.top .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:var(--band-fg)}
header.top .pill.err{background:#FFFFFF;color:var(--warn);border-color:#FFFFFF}
header.top #logout{background:transparent;color:var(--band-fg);border-color:rgba(255,255,255,.5)}
header.top #logout:hover{background:rgba(255,255,255,.12);border-color:#FFFFFF}
header.top .brand{gap:18px}
.crest{background:#FFFFFF;border:0;border-radius:var(--r-lg);padding:6px;height:76px;box-shadow:0 0 0 4px rgba(255,255,255,.16)}
body[data-view="inicio"] .crest{height:112px}
@media (max-width:480px){.crest{height:56px}body[data-view="inicio"] .crest{height:80px}}
h1{color:var(--band-fg);letter-spacing:.005em;line-height:.95}
body[data-view="inicio"] .brandtxt h1{font-size:clamp(2.1rem,7vw,4rem)}
header.top a:focus-visible,header.top button:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}

/* Navegación: pestañas fijas arriba al bajar */
.nav{position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--line);margin-top:-8px;padding-top:4px}
.nav a,#nav-menu{font-size:1.2rem;letter-spacing:.05em}
.nav a[aria-current="page"],#nav-menu[data-on]{border-bottom-color:var(--accent2)}
.mpop{border-radius:var(--r-lg);box-shadow:0 12px 32px rgba(16,30,60,.18)}

/* Títulos y rótulos: menos mayúsculas */
h2{font-size:1.75rem;font-weight:600;text-transform:none;letter-spacing:.01em}
h3{font-size:1.3rem}
label.f>span,.lab,.hoybox .lab,.wk .lab,.mibox .lab{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:.9rem;font-weight:600;color:var(--muted)}
.cal .dh{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:.85rem}
.sched th{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:600}
.home .today{font-size:1.6rem;color:var(--fg)}

/* Superficies */
.editor,.hoybox,.wk,.mibox,.notice,.alist,.chartc,.tcard,.dayed,.faltan{border-radius:var(--r-lg)}
.notice{border-style:solid}
.hoybox{border-left-width:1px;border-top:4px solid var(--accent)}
.sheetwrap{border-radius:var(--r-sm)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],textarea,select{border-radius:var(--r-sm);padding:9px 11px;background:var(--surface)}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.b{border-radius:var(--r-sm);padding:8px 14px;min-height:38px;font:600 .95rem var(--body)}
button.b.pri:hover{filter:brightness(1.08)}
button.b.danger{border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.linkbtn{font-weight:600}

/* Planteles */
.sqhead{border-bottom-width:3px}

/* Calendario */
.cal{gap:6px}
.cal button{border-radius:var(--r-sm);min-height:72px;border-color:transparent;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.cal button.fin{background:var(--sunk)}
.cal button.hoy{outline:0;box-shadow:inset 0 0 0 2px var(--accent)}
.cal button.hoy .n{background:var(--accent);color:var(--accent-fg);border-radius:999px;min-width:1.7em;height:1.7em;display:inline-flex;align-items:center;justify-content:center;margin:-2px 0 0 -2px}
.cal button.par{box-shadow:inset 0 0 0 2px #1E9E5A}
.cal button.hoy.par{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fg)}
.calhead .mes{font-size:1.4rem}

/* Seleccionado: azul del club */
.pbtn[aria-pressed="true"],.tab[aria-pressed="true"],.wmode button[aria-pressed="true"],.rtype button[aria-pressed="true"],.loads button[aria-pressed="true"],.dayed .opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* Ingreso */
.login{max-width:380px}
#notice:has(.login){align-items:stretch;max-width:460px;padding:28px}

<script>
(function(){
"use strict";
var DAYS=[["lun","Lunes"],["mar","Martes"],["mie","Miércoles"],["jue","Jueves"],["vie","Viernes"],["sab","Sábado"]];
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var LOADTXT=["Sin definir","Muy liviana","Liviana","Media","Alta","Muy alta"];
var db=null,canWrite=true,S={config:null,cats:{}},sel={c:null,w:null},got={config:false,cats:false};
var timers={},busy={},again={},hadErr=false,edMsg="";
var pendingImport=null,impMsg="",mailMsg="",me="";
var P={},selP=null,openCat=null,VIEWS=["inicio","horarios","planteles","wellness","asistencia","planificacion","ajustes"];
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function parseD(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");if(!m)return new Date(Date.UTC(2026,10,9));return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));}
function addD(d,n){return new Date(d.getTime()+n*864e5);}
function fmt(d,y){return d.getUTCDate()+" "+MES[d.getUTCMonth()]+(y?" "+d.getUTCFullYear():"");}
function nWeeks(p){var k=Math.round(+p.weeks||1);return Math.max(1,Math.min(26,k));}
function tone(p,i){var t=+p.tone||((i%6)+1);return "tone"+Math.max(1,Math.min(6,t));}
function weeks(){
  var out=[],n=0,st=parseD(S.config.start),ph=S.config.phases||[];
  ph.forEach(function(p,pi){for(var i=0;i<nWeeks(p);i++){out.push({key:p.id+"_"+i,phase:p,pi:pi,i:i,n:n,start:addD(st,n*7)});n++;}});
  return out;
}
function getW(c,k){var d=S.cats[c];var w=d&&d.weeks&&d.weeks[k];return w||{load:0,focus:"",days:{}};}
function ensureW(c,k){
  if(!S.cats[c])S.cats[c]={weeks:{}};
  if(!S.cats[c].weeks)S.cats[c].weeks={};
  var w=S.cats[c].weeks[k];
  if(!w)w=S.cats[c].weeks[k]={load:0,focus:"",days:{}};
  if(!w.days)w.days={};
  return w;
}
function todayIdx(ws){
  var now=Date.now();
  for(var i=0;i<ws.length;i++){var a=ws[i].start.getTime();if(now>=a&&now<a+7*864e5)return i;}
  return -1;
}

/* ---------- guardado ---------- */
function setStatus(){
  var el=$("#status");el.classList.remove("err");
  if(!db){el.textContent="Sin conexión a los datos";return;}
  if(!canWrite){el.textContent="Solo lectura";return;}
  if(hadErr){el.textContent="No se pudo guardar";el.classList.add("err");return;}
  var pend=Object.keys(timers).some(function(k){return timers[k];})||Object.keys(busy).some(function(k){return busy[k];});
  el.textContent=pend?"Guardando…":"Guardado";
}
function isDirty(k){return !!timers[k]||!!busy[k];}
function dirty(k){
  if(!canWrite||!db)return;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(function(){timers[k]=null;flush(k);},700);
  setStatus();
}
function flush(k){
  if(busy[k]){again[k]=true;return;}
  busy[k]=true;setStatus();
  var p;
  try{
    if(k==="config"){p=db.doc("plan/config").set(clone(S.config));syncPub();}
    else if(k.indexOf("cat:")===0){var id=k.slice(4);p=S.cats[id]?db.doc("cats/"+id).set(clone(S.cats[id])):db.doc("cats/"+id).delete();}
    else{var pid=k.slice(3);p=P[pid]?db.doc("players/"+pid).set(clone(P[pid])):db.doc("players/"+pid).delete();if(P[pid])syncAthlete(pid);syncReg();}
  }catch(e){p=Promise.reject(e);}
  p.then(function(){hadErr=false;},function(e){
    if(e&&e.code==="permission-denied"){canWrite=false;renderAll(true);}
    else hadErr=true;
  }).then(function(){
    busy[k]=false;
    if(again[k]&&canWrite){again[k]=false;flush(k);}
    setStatus();
  });
}

/* ---------- render ---------- */
function renderHeader(){
  var c=S.config,ws=weeks();
  $("#club").textContent=c.titulo||"Hockey Union Casildense 2027";
  if(ws.length){
    var a=ws[0].start,b=addD(ws[ws.length-1].start,6);
    $("#range").textContent=fmt(a,true)+" → "+fmt(b,true)+" · "+ws.length+" semanas · "+(c.cats||[]).length+" categorías";
  }else $("#range").textContent="";
}
var DKEY=["dom","lun","mar","mie","jue","vie","sab"];
var DLONG=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var cal={y:null,m:null,sel:null};
function isoL(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function partidosDe(iso,cfg){var e=((cfg||S.config).eventos||{})[iso];if(!e)return [];
  if(Array.isArray(e.partidos))return e.partidos;
  return e.tipo==="partido"?[{cat:"",nota:e.nota||""}]:[];}
function catName(id,cfg){var k=((cfg||S.config).cats||[]).filter(function(c){return c.id===id;})[0];return k?k.name:"Todo el club";}
function partidoTxt(p,cfg){return catName(p.cat,cfg)+(p.nota?": "+p.nota:"");}
function setPartidos(iso,arr){var c=S.config;c.eventos=c.eventos||{};if(arr.length)c.eventos[iso]={partidos:arr};else delete c.eventos[iso];dirty("config");}
function largo(d){return DLONG[d.getDay()]+" "+d.getDate()+" de "+MESL[d.getMonth()];}
function calHtml(now){
  var c=S.config,hs=c.horarios||{},cats=c.cats||[],hoy=isoL(now);
  if(cal.y==null){cal.y=now.getFullYear();cal.m=now.getMonth();}
  var tr={};DAYS.forEach(function(d){tr[d[0]]=cats.some(function(k){return hs[k.id]&&hs[k.id][d[0]];});});
  var first=new Date(cal.y,cal.m,1),n=new Date(cal.y,cal.m+1,0).getDate(),off=(first.getDay()+6)%7;
  var h='<div class="calhead"><h2>Calendario</h2><div class="row"><button type="button" class="b ico" data-cal="-1" aria-label="Mes anterior">‹</button><span class="mes">'+MESL[cal.m]+' '+cal.y+'</span><button type="button" class="b ico" data-cal="1" aria-label="Mes siguiente">›</button><button type="button" class="b" data-cal="0">Hoy</button></div></div>';
  h+='<div class="cal">';["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].forEach(function(x){h+='<span class="dh">'+x+'</span>';});
  for(var i=0;i<off;i++)h+='<span></span>';
  for(var d=1;d<=n;d++){
    var dt=new Date(cal.y,cal.m,d),iso=isoL(dt),wd=dt.getDay(),ps=partidosDe(iso);
    var par=ps.length>0,tip=ps.map(function(x){return partidoTxt(x);}).join("\n");
    h+='<button type="button" data-day="'+iso+'" class="'+(wd===0||wd===6?"fin":"")+(iso===hoy?" hoy":"")+(par?" par":"")+'" aria-pressed="'+(cal.sel===iso)+'" aria-label="'+largo(dt)+(par?", "+esc(tip):"")+'"'+(par?' data-tip="'+esc(tip)+'"':'')+'><span class="n">'+d+'</span>';
    if(par)h+='<span class="chk" aria-hidden="true">✓</span>';
    if(tr[DKEY[wd]])h+='<span class="tr" title="Hay entrenamiento"></span>';
    h+='</button>';
  }
  h+='</div><div class="callegend"><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent)"></i>Entrenamiento</span><span><i class="chk" style="font-style:normal;position:static">✓</i>Partido (pasá el mouse o tocá el día para ver cuál y de qué categoría)</span>';
  h+='</div>';
  if(cal.sel){
    var sd=new Date(+cal.sel.slice(0,4),+cal.sel.slice(5,7)-1,+cal.sel.slice(8,10)),sp=partidosDe(cal.sel);
    h+='<div class="dayed"><h3>'+largo(sd).replace(/^./,function(ch){return ch.toUpperCase();})+'</h3>';
    if(canWrite){
      if(!sp.length)h+='<p class="muted small">Sin partidos cargados este día.</p>';
      sp.forEach(function(x,i){

var selS=null,EXB=["mov","act","c1","c2"],DAYN=["dom","lun","mar","mié","jue","vie","sáb"];
function isoD(d){return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");}
function diaCorto(iso){var d=parseD(iso);return DAYN[d.getUTCDay()]+" "+d.getUTCDate()+"/"+(d.getUTCMonth()+1);}
function newSess(date,nota,id){return {id:id||("s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),date:date||"",nota:nota||"",ev:"",mov:[],movS:"",act:[],actS:"",fza:"",c1:[],c1S:"",c2:[],c2S:"",tec:"",metT:"",met:"",g:["","","","",""],vol:"",tpo:""};}
function sessOf(w,start){
  if(w&&Array.isArray(w.sessions))return w.sessions;
  var out=[];
  DAYS.forEach(function(x,i){var t=w&&w.days&&w.days[x[0]];if(t&&String(t).trim())out.push(newSess(isoD(addD(start,i)),String(t),"m"+x[0]));});
  return out;
}

function histImport(){
  if(!canWrite||!HI.rows)return;

  HI.rows.forEach(function(r){
    if(!r.sel)return;var id=r.sel;

    if(!P[id])return;var pl=P[id];pl.evals=pl.evals||[];
    var mt=HMETA[r.n]||{};

      if(!e){e={id:"h"+x.d.replace(/-/g,""),date:x.d,vals:{}};pl.evals.push(e);}

function chartSvg(pts,o){
  o=o||{};var W=280,H=124,L=10,R=10,T=22,B=22,n=pts.length,vs=pts.map(function(x){return x.v;});
  if(o.ref!=null)vs=vs.concat([o.ref]);
  var lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);if(hi===lo){hi+=1;lo-=1;}
  var pad=(hi-lo)*.15;lo-=pad;hi+=pad;
  var X=function(i){return n===1?W/2:L+(W-L-R)*i/(n-1);},Y=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo));};
  var r1=function(v){return Math.round(v*10)/10;},u=o.unit?" "+o.unit:"";
  var h='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||"Evolución")+'">';
  h+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-width="1"/>';
  if(o.ref!=null){var ry=r1(Y(o.ref));h+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ry+'" y2="'+ry+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>';}
  h+='<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(x,i){return r1(X(i))+","+r1(Y(x.v));}).join(" ")+'"/>';
  pts.forEach(function(x,i){
    h+='<circle class="hit" cx="'+r1(X(i))+'" cy="'+r1(Y(x.v))+'" r="12" fill="transparent"><title>'+esc(x.x)+': '+esc(num(x.v))+esc(u)+'</title></circle>'+
       '<circle class="dot" cx="'+r1(X(i))+'" cy="'+r1(Y(x.v))+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" pointer-events="none"/>';
  });
  var lab=function(i,anchor){var x=pts[i],yy=Y(x.v)-9;if(yy<11)yy=Y(x.v)+17;return '<text class="v" x="'+r1(X(i))+'" y="'+r1(yy)+'" text-anchor="'+anchor+'">'+esc(num(x.v))+'</text>';};
  if(n>1)h+=lab(0,"start");h+=lab(n-1,n>1?"end":"middle");
  h+='<text x="'+L+'" y="'+(H-6)+'">'+esc(pts[0].x)+'</text>';
  if(n>1)h+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+esc(pts[n-1].x)+'</text>';
  return h+'</svg>';
}

function okId(x){return /^[A-Za-z0-9_-]{1,100}$/.test(x);}
function applyImport(d){
  if(!d||typeof d!=="object"||!d.config||!Array.isArray(d.config.phases)||!Array.isArray(d.config.cats))return false;
  var cats=d.cats&&typeof d.cats==="object"?d.cats:{},pls=d.players&&typeof d.players==="object"?d.players:{};
  if(!Object.keys(cats).every(okId)||!Object.keys(pls).every(okId))return false;
  var oldC=Object.keys(S.cats),oldP=Object.keys(P);
  S.config=clone(d.config);S.cats=clone(cats);P=clone(pls);selP=null;
  S.config.cats.forEach(function(c){if(okId(c.id)&&!S.cats[c.id])S.cats[c.id]={weeks:{}};});
  dirty("config");
  Object.keys(S.cats).concat(oldC).forEach(function(id){dirty("cat:"+id);});
  Object.keys(P).concat(oldP).forEach(function(id){dirty("pl:"+id);});
  Object.keys(P).forEach(function(id){if(P[id].email)syncAthlete(id);});
  return true;
}
function readImport(file,done){
  var r=new FileReader();
  r.onload=function(){var d=null;try{d=JSON.parse(String(r.result));}catch(e){}done(d);};
  r.onerror=function(){done(null);};
  r.readAsText(file);
}

}

/* cuerpo técnico: solapa Wellness */
var wl={cat:null,date:null,key:"",rows:null,mode:"dia",wk:null};
function dLoc(iso){return new Date(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10));}
function dPlus(iso,n){var d=dLoc(iso);d.setDate(d.getDate()+n);return isoL(d);}
function lunesDe(iso){var d=dLoc(iso);return dPlus(iso,-((d.getDay()+6)%7));}
function cargaDe(d){return d&&d.min&&d.rpe!=null?d.rpe*d.min:null;}
function wlIds(){return Object.keys(P).filter(function(id){return P[id].cat===wl.cat;})
    .sort(function(a,b){return String(P[a].name||"").localeCompare(String(P[b].name||""),"es");});}
function loadWellness(force){
  if(!S.config||!db)return;
  var cats=S.config.cats||[];
  if(!cats.some(function(c){return c.id===wl.cat;}))wl.cat=cats.length?cats[0].id:null;
  if(!wl.date)wl.date=isoToday();
  var key=wl.mode+"|"+wl.cat+"|"+wl.date;
  if(!force&&key===wl.key){renderWellness();return;}
  wl.key=key;wl.rows=null;wl.wk=null;renderWellness();
  var ids=wlIds();
  if(wl.mode==="semana"){
    var lun=lunesDe(wl.date),desde=dPlus(lun,-7),hasta=dPlus(lun,6);
    Promise.all(ids.map(function(id){
      var m=P[id].email;
      if(!m)return {id:id,state:"nomail"};
      var q=function(c){return db.collection("atletas/"+m+"/"+c).where("fecha",">=",desde).where("fecha","<=",hasta).get().then(function(sn){return sn.docs.map(function(x){return x.data();});});};
      return Promise.all([q("rpe"),q("wellness")]).then(function(r){
        var carga={},sinMin={},resp={};
        r[0].forEach(function(d){var c=cargaDe(d);if(c==null)sinMin[d.fecha]=true;else carga[d.fecha]=(carga[d.fecha]||0)+c;});
        r[1].forEach(function(d){resp[d.fecha]=true;});
        return {id:id,state:"ok",carga:carga,sinMin:sinMin,resp:resp};
      },function(){return {id:id,state:"err"};});
    })).then(function(rows){if(wl.key!==key)return;wl.wk={lun:lun,rows:rows};renderWellness();});
    return;
  }
  var d0=dPlus(wl.date,-28),d1=dPlus(wl.date,-1);
  var asP=db.doc("asist/"+wl.cat+"_"+wl.date).get().then(function(r){return r.exists?(r.data().pres||{}):{};},function(){return {};});
  Promise.all([asP].concat(ids.map(function(id){
    var m=P[id].email;
    if(!m)return {id:id,state:"nomail"};
    var rp=RT.map(function(t){return db.doc("atletas/"+m+"/rpe/"+wl.date+"_"+t[0]).get().then(function(r){return r.exists?r.data():null;},function(){return null;});});
    var hp=db.collection("atletas/"+m+"/wellness").where("fecha",">=",d0).where("fecha","<=",d1).get().then(function(sn){
      var ts=sn.docs.map(function(x){return wTotal(x.data());}).filter(function(v){return v!=null;});
      return ts.length>=3?ts.reduce(function(a,b){return a+b;},0)/ts.length:null;
    },function(){return null;});
    return Promise.all(rp.concat([hp])).then(function(rr){
      return db.doc("atletas/"+m+"/wellness/"+wl.date).get().then(function(sn){
        return sn.exists?{id:id,state:"ok",d:sn.data(),g:rr[0],h:rr[1],avg:rr[2]}:{id:id,state:"pend",g:rr[0],h:rr[1]};
      },function(){return {id:id,state:"err",g:rr[0],h:rr[1]};});
    });
  }))).then(function(res){if(wl.key!==key)return;wl.pres=res[0];wl.rows=res.slice(1);renderWellness();});
}
function rpeCell(d){
  if(!d)return '<td class="muted">–</td>';
  var c=cargaDe(d);
  return '<td><b>'+esc(d.rpe)+'</b> <span class="muted small">'+(d.min?'× '+esc(d.min)+' min = </span><b>'+c+'</b>':'· sin minutos</span>')+'</td>';

function semanaHtml(){
  var w=wl.wk,hoy=isoToday(),dias=[],prev=[],i;
  for(i=0;i<7;i++){dias.push(dPlus(w.lun,i));prev.push(dPlus(w.lun,i-7));}
  var pas=dias.filter(function(d){return d<=hoy;}),pas14=pas.length+7;
  var h='<p class="muted">Semana del '+esc(fechaCorta(dias[0]))+' al '+esc(fechaCorta(dias[6]))+'. La carga de cada entrenamiento es RPE × minutos; acá se suma por día y por semana.</p>';
  h+='<div class="sheetwrap"><table class="sheet"><thead><tr><th scope="col">Jugadora</th>';
  ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].forEach(function(n,k){h+='<th scope="col" class="r'+(dias[k]===hoy?' hoyc':'')+'">'+n+'<small>'+(+dias[k].slice(8))+'</small></th>';});
  h+='<th scope="col" class="r">Carga<small>de la semana</small></th><th scope="col" class="r">Semana<small>anterior</small></th><th scope="col" class="r">Cambio</th><th scope="col" class="r">Wellness<small>respondidos</small></th><th scope="col" class="r">Respuesta<small>últimos '+pas14+' días</small></th></tr></thead><tbody>';
  var tot=0,totP=0,n=0;
  w.rows.forEach(function(r){
    var pl=P[r.id]||{};
    h+='<tr><th scope="row">'+esc(pl.name||"Sin nombre")+'</th>';
    if(r.state!=="ok"){h+='<td colspan="12" class="muted">'+(r.state==="nomail"?"Sin mail de ingreso cargado":"No se pudo leer")+'</td></tr>';return;}
    var sum=0,sumP=0,rs=0,rs14=0;
    dias.forEach(function(d){
      var c=r.carga[d];if(c)sum+=c;
      h+='<td class="r'+(d===hoy?' hoyc':'')+'">'+(c?c:r.sinMin[d]?'<span class="muted small" title="Cargó RPE sin minutos">s/min</span>':'<span class="muted">–</span>')+'</td>';
    });
    prev.forEach(function(d){if(r.carga[d])sumP+=r.carga[d];if(r.resp[d])rs14++;});
    pas.forEach(function(d){if(r.resp[d]){rs++;rs14++;}});
    tot+=sum;totP+=sumP;n++;
    var ch=sumP>0?Math.round((sum-sumP)/sumP*100):null,pc=Math.round(rs14/pas14*100);
    h+='<td class="r"><b>'+sum+'</b></td><td class="r">'+sumP+'</td><td class="r'+(ch!=null&&ch>30?' low':'')+'">'+(ch==null?'–':(ch>0?'+':'')+ch+'%')+'</td>'+
       '<td class="r">'+rs+' de '+pas.length+'</td><td class="r'+(pc<50?' low':'')+'">'+pc+'%</td></tr>';
  });
  h+='</tbody>';
  if(n)h+='<tfoot><tr><th scope="row">Promedio del plantel</th><td colspan="7"></td><td class="r">'+Math.round(tot/n)+'</td><td class="r">'+Math.round(totP/n)+'</td><td class="r">'+(totP>0?((tot-totP)/totP>0?'+':'')+Math.round((tot-totP)/totP*100)+'%':'–')+'</td><td colspan="2"></td></tr></tfoot>';
  return h+'</table></div><p class="small muted">En rojo: carga que subió más de 30% respecto de la semana anterior, y respuesta al wellness por debajo de 50%. «s/min» es un RPE cargado sin minutos, que no suma a la carga.</p>';
}

  db.collection("cats").onSnapshot(function(q){

    Object.keys(S.cats).forEach(function(id){if(!seen[id]&&!isDirty("cat:"+id))delete S.cats[id];});
    ready();
  },onErr);
  db.collection("players").onSnapshot(function(q){
    var seen={};
    q.docs.forEach(function(d){seen[d.id]=1;if(!isDirty("pl:"+d.id))P[d.id]=clone(d.data());});
    Object.keys(P).forEach(function(id){if(!seen[id]&&!isDirty("pl:"+id))delete P[id];});
    setTimeout(backfill,1500);

}
(function(){
  if(typeof firebase==="undefined"){showNotice('<p>No se pudo cargar la app. Revisá tu conexión a internet y volvé a abrir la página.</p>');$("#status").textContent="Sin conexión";return;}
  if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.indexOf("PEGAR")===0){
    showNotice('<h3>Falta conectar la base de datos</h3><p class="muted">Pegá la configuración de Firebase al principio de este archivo, donde dice FIREBASE_CONFIG.</p>');
    $("#status").textContent="Sin configurar";return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();
  auth.onAuthStateChanged(function(u){
    if(!u){if(!started)showLogin();return;}
    if(started)return;
    me=String(u.email||"").toLowerCase();
    showNotice('<p>Cargando…</p>');
    db=firebase.firestore();
    db.doc("plan/config").get().then(function(){start();},function(e){
      if(e&&e.code==="permission-denied")startAthlete();
      else{$("#logout").hidden=false;showNotice('<p>No se pudo acceder a los datos. Revisá tu conexión y volvé a abrir la app.</p>');}
    });
  });
})();
})();
</script>
